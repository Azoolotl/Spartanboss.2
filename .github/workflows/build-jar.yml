name: Build Fabric Mod JAR

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - '**/*.zip'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'settings.gradle*'
      - 'src/**'
      - 'fabric.mod.json'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '**/*.zip'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'settings.gradle*'
      - 'src/**'
      - 'fabric.mod.json'

permissions:
  contents: read

concurrency:
  group: fabric-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'

      - name: Extract uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 2 -type f -name '*.zip' ! -path './.git/*' -print -quit)"
          if [[ -z "${archive}" ]]; then
            echo "::error::No source ZIP archive found in the repository."
            exit 1
          fi
          mkdir -p build-input
          unzip -q "${archive}" -d build-input

      - name: Build Fabric mod
        shell: bash
        run: |
          set -euo pipefail
          build_file="$(find build-input -type f -name 'build.gradle' -print -quit)"
          if [[ -z "${build_file}" ]]; then
            build_file="$(find build-input -type f -name 'build.gradle.kts' -print -quit)"
          fi
          if [[ -z "${build_file}" ]]; then
            echo "::error::The uploaded ZIP does not contain build.gradle or build.gradle.kts."
            echo "Archive contents:"
            find build-input -maxdepth 4 -type f | head -100
            exit 1
          fi
          project_dir="$(dirname "${build_file}")"
          cd "${project_dir}"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build
          else
            gradle --no-daemon clean build
          fi

      - name: Upload compiled JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpartanBoss-mod-JAR
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
