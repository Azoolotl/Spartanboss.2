name: Build Fabric Mod JAR

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'settings.gradle*'
      - 'src/**'
      - 'fabric.mod.json'
  pull_request:
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'settings.gradle*'
      - 'src/**'
      - 'fabric.mod.json'

permissions:
  contents: read

concurrency:
  group: fabric-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build with Gradle Wrapper when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build
          elif [[ -f ./build.gradle || -f ./build.gradle.kts ]]; then
            gradle --no-daemon clean build
          else
            echo "::error::No Gradle build file found at repository root. Add the mod source project (including build.gradle or build.gradle.kts) and run this workflow again."
            exit 1
          fi

      - name: Upload compiled JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpartanBoss-mod-JAR
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
